name: SoaPay CI

on:
  push:
    branches:
      - main
      - staging
      - develop
      - 'features/**'
  pull_request:
    branches:
      - main
      - staging
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven:
    name: Maven build and tests
    uses: ./.github/workflows/maven.yml
