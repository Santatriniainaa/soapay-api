spring:
  application:
    name: soapay
  profiles:
    default: local
  datasource:
    url: jdbc:h2:mem:soapay_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time-zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: INFO
    '[com.soapay.api]': INFO
springdoc:
  swagger-ui:
    path: /swagger-ui.html

api:
  simulation:
    result: ${API_SIMULATION_RESULT:SUCCESS}
demo:
  security:
    client:
      username: ${DEMO_CLIENT_USERNAME:demo-client}
      password: ${DEMO_CLIENT_PASSWORD:change-me-client}
    admin:
      username: ${DEMO_ADMIN_USERNAME:demo-admin}
      password: ${DEMO_ADMIN_PASSWORD:change-me-admin}

---
spring:
  config:
    activate:
      on-profile: test
api:
  simulation:
    result: SUCCESS
demo:
  security:
    client:
      username: test-client
      password: test-client-password
    admin:
      username: test-admin
      password: test-admin-password

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
api:
  simulation:
    result: ${API_SIMULATION_RESULT:SUCCESS}
demo:
  security:
    client:
      username: ${DEMO_CLIENT_USERNAME}
      password: ${DEMO_CLIENT_PASSWORD}
    admin:
      username: ${DEMO_ADMIN_USERNAME}
      password: ${DEMO_ADMIN_PASSWORD}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI}
api:
  simulation:
    enabled: false
